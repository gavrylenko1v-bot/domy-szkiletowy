em.</text><text x="85" y="720" font-size="16" fill="#607164">Otwory, instalacje, nasłonecznienie i zgodność wizualizacji wymagają sprawdzenia przez projektanta.</text><rect x="85" y="745" width="82" height="7" fill="#203d30"/><rect x="167" y="745" width="82" height="7" fill="#bbc6b8"/><text x="264" y="754" font-size="15" >2 m</text></g></g></svg>